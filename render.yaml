services:
  - type: web
    name: sns-dev-beta-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && node --import tsx src/server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22.23.3'
      - key: HOST
        value: '0.0.0.0'
      - key: PUBLIC_ORIGIN
        value: https://ring128.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: sns-dev-beta-db
          property: connectionString

databases:
  - name: sns-dev-beta-db
    plan: free
    databaseName: snsdevbeta
    ipAllowList: []
